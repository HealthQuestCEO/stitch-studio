<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Stitch Studio</div>
  <nav class="steps" id="steps"></nav>
  <div class="top-actions">
    <button class="ghost" id="startOver" title="Start over">↺ Start over</button>
    <button class="ghost" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="ghost" id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <span class="saved" id="saved">Saved</span>
  </div>
</header>

<main class="layout">
  <section class="panel" id="panel"></section>

  <aside class="preview-wrap">
    <div class="timer" id="timer"><span id="timerNum">0.0</span><small> sec</small></div>
    <div class="phone" id="phone">
      <video id="preview" playsinline></video>
      <canvas id="vcanvas" class="hidden" width="1080" height="1920"></canvas>
      <div class="prompter hidden" id="prompter"><div id="prompterText"></div></div>
      <div class="rec-dot hidden" id="recDot">● REC</div>
      <div class="cropguide hidden" id="cropGuide"></div>
      <div class="empty" id="emptyPreview">Your 9:16 preview shows here</div>
    </div>
    <div class="preview-controls">
      <button class="ghost" id="playClean" title="Play only the parts you're keeping">▶ Play</button>
    </div>
  </aside>
</main>

<div class="toast hidden" id="toast"></div>
<div class="modal hidden" id="overModal"><div class="modal-card">
  <h2>Start over</h2>
  <p class="sub">Pick how much to redo. The first two can be undone.</p>
  <button class="over" data-over="clean"><b>Redo the cleanup</b><span>Keeps your takes. Runs Clean again from scratch, so any words or pauses you put back are reset.</span></button>
  <button class="over" data-over="edits"><b>Clear all edits</b><span>Keeps your takes and cleanup. Removes text styling, B-roll, transitions, mirror effects, graphics and splits.</span></button>
  <button class="over danger" data-over="reel"><b>Start this reel over</b><span>Deletes every take and edit for this reel. Keeps the reel name, hook, script and date. Can't be undone.</span></button>
  <button class="btn" id="overCancel">Cancel</button>
</div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
