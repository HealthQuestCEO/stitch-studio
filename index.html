<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stitch Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,600;0,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <div class="brand">Stitch Studio</div>
  <nav class="steps" id="steps"></nav>
  <div class="top-actions">
    <button class="ghost" id="undo" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button class="ghost" id="redo" title="Redo (Ctrl+Shift+Z)">↷ Redo</button>
    <span class="saved" id="saved">Saved</span>
  </div>
</header>

<main class="layout">
  <section class="panel" id="panel"></section>

  <aside class="preview-wrap">
    <div class="timer" id="timer"><span id="timerNum">0.0</span><small> sec</small></div>
    <div class="phone" id="phone">
      <video id="preview" playsinline></video>
      <div class="prompter hidden" id="prompter"><div id="prompterText"></div></div>
      <div class="rec-dot hidden" id="recDot">● REC</div>
      <div class="empty" id="emptyPreview">Your 9:16 preview shows here</div>
    </div>
    <div class="preview-controls">
      <button class="ghost" id="playClean" title="Play only the parts you're keeping">▶ Play</button>
    </div>
  </aside>
</main>

<div class="toast hidden" id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
